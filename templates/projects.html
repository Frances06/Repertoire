{% extends "base.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Projects{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<body>
    {% block content %}
    {% for project in projects %}
    <div class="container text-center">
  <div class="row">
    <div class="col">
      Column
    </div>
    <div class="col">
      Column
    </div>
    <div class="col">
      Column
    </div>
  </div>
</div>
        <div class="card">
            <img src="{{ url_for('static', filename='images/projects/' ~ project[4]) }}" height="132px"/>
            <div class="card-header">{{ project[1] }}</div>
            <div class="card-body">{{ project[3] }}</div>
            <div class="card-actions">
                <button class="card-btn"><a href="{{ url_for('projects', filename='' ~ project[5]) }}" download="{{ project[5] }}">Try <i class="fa-solid fa-download"></i></a></button>
            </div>
        </div>
    {% endfor %}
    {% endblock %}
</body>
</html>
