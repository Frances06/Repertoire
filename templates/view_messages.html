{% extends "base.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
</head>
<body>
    {% block content %}
        <h1>Messages</h1>
        <ul>
            {% for message in messages %}
                <li>
                    <strong>{{ message[1] }}</strong> ({{ message[2] }}) - {{ message[3] }}
                </li>
            {% endfor %}
        </ul>
    {% endblock %}
</body>
</html>
