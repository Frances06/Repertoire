<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}Home{% endblock %} | Portfolio</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Nunito:wght@400;500;600;700;800&family=Playwrite+GB+J:wght@300;400&family=Poetsen+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <div class="welcome">
      <a class="site-mark" href="{{ url_for('home') }}">fn</a>
      <span class="site-heading">A little corner of the internet</span>
      <div class="theme-picker">
        <button class="theme-toggle" type="button" aria-label="Choose colour theme" aria-expanded="false">
          <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
        </button>
        <div class="contrast-dropdown" hidden>
          <button type="button" data-theme-choice="light">Light mode</button>
          <button type="button" data-theme-choice="dark">Dark mode</button>
          <button type="button" data-theme-choice="high-contrast">High contrast</button>
        </div>
      </div>
    </div>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('projects') }}">Projects</a></li>
        <li><a href="{{ url_for('about') }}">About</a></li>
        <li><a href="{{ url_for('contact') }}">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <section class="music-player" aria-label="Site music player" data-player>
    <div class="player-hint" data-player-hint hidden>
      <span>There’s music here, too <span aria-hidden="true">♫</span></span>
      <button type="button" data-dismiss-hint aria-label="Dismiss music player tip">&times;</button>
    </div>
    <div class="player-compact">
      <button class="player-expand" type="button" data-expand-player aria-expanded="false" aria-controls="player-details">
        <i class="fa-solid fa-music" aria-hidden="true"></i>
        <span class="player-label">A little soundtrack</span>
        <span class="track-title" data-track-title>No tracks added yet</span>
        <i class="fa-solid fa-chevron-up expand-icon" aria-hidden="true"></i>
      </button>
      <div class="compact-controls">
        <button type="button" data-play aria-label="Play" disabled><i class="fa-solid fa-play" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="player-details" id="player-details" data-player-details hidden>
      <div class="player-progress" data-progress-container role="slider" tabindex="0" aria-label="Audio progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="player-progress-fill" data-progress></div>
      </div>
      <div class="player-actions">
        <button type="button" data-prev aria-label="Previous track" disabled><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
        <button type="button" data-play-large aria-label="Play" disabled><i class="fa-solid fa-play" aria-hidden="true"></i></button>
        <button type="button" data-next aria-label="Next track" disabled><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
        <button type="button" data-loop aria-label="Repeat track" aria-pressed="false"><i class="fa-solid fa-repeat" aria-hidden="true"></i></button>
        <button type="button" data-toggle-list aria-expanded="false" aria-controls="player-playlist"><i class="fa-solid fa-list" aria-hidden="true"></i><span class="visually-hidden">Toggle playlist</span></button>
      </div>
      <ul class="player-playlist" id="player-playlist" data-playlist hidden></ul>
      <audio data-audio preload="metadata"></audio>
    </div>
  </section>

  <footer class="footer">
    <p><a href="{{ url_for('contact') }}">Get in touch</a> · <a href="https://github.com/Frances06" target="_blank" rel="noopener noreferrer">GitHub</a> · <a href="https://www.linkedin.com/in/frances-nwabisi-b27409426/" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>
    <p>&copy; <span data-current-year></span> · Made with curiosity (and probably too much Python).</p>
  </footer>
  <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
