<!-- Layout template used by the website -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} | My Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Poetsen+One&display=swap" rel="stylesheet">    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <body>
    <header>
        <div class="welcome">
            <h1>Welcome to My Portfolio</h1>
            <img src="{{ url_for('static', filename='images/contrast.svg') }}">
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}">fn</a></li>
                <li><a href="#">Contact</a></li>                
                <li><a href="#">Projects</a></li>                
                <li><a href="#">About</a></li>                
                <li><a href="{{ url_for('home') }}">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- Main content goes here -->
        {% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; <span id="current-year"></span> My Portfolio</p>
    </footer>

    
    <div class="player">
        <div class="line">
            <label class="file-btn">
                <i class="fa-solid fa-upload"></i>
                <input type="file" id="upload" accept="audio/*">
            </label>
            <h3 id="track-title" style="display: inline;">Loading...</h3>
        </div>
        <div id="progress-container">
            <div id="progress"></div>
        </div>
        <audio id="audio" preload="metadata"></audio>
        <div class="controls">
            <button id="prev"><i class="fa-solid fa-backward-fast"></i></button>
            <button id="play"><i class="fa-solid fa-play"></i></button>
            <button id="next"><i class="fa-solid fa-forward-fast"></i></button>
        </div>
        <button id="loop">🔁 Loop</button>
        <ul id="playlist"></ul>
    </div>
<script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
