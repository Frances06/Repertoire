<!-- Layout template used by the website -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} | My Portfolio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Poetsen+One&display=swap" rel="stylesheet"></head>
<body>
    <header>
        <div class="welcome">
            <h1>Welcome to My Portfolio</h1>
            <img src="{{ url_for('static', filename='images/contrast.svg') }}">
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}">fn</a></li>
                <li><a href="#">Contact</a></li>                
                <li><a href="#">Projects</a></li>                
                <li><a href="#">About</a></li>                
                <li><a href="{{ url_for('home') }}">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- Main content goes here -->
        {% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; <span id="current-year"></span> My Portfolio</p>
    </footer>
    
    <input type="file" id="upload" accept="audio/*">
    <div class="player">
    <h3 id="track-title">Loading...</h3>
    <audio id="audio" preload="metadata"></audio>
    <div class="controls">
        <button id="prev">⏮ Prev</button>
        <button id="play">▶ Play</button>
        <button id="next">⏭ Next</button>
    </div>
    <ul id="playlist"></ul>
</div>
<script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
