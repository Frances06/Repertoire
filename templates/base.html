<!-- Layout template used by the website -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | My Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&family=Poetsen+One&display=swap" rel="stylesheet">    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <body>
    <header>
        <div class="welcome">
            <h1>Welcome to My Portfolio</h1>
            <div style="display: inline-block; position: relative;">
                <img src="{{ url_for('static', filename='images/contrast.svg') }}" alt="change contrast" class="contrast" tabindex="1">
                <div class="contrast-dropdown">
                    <button onclick="setTheme('light')">Light Mode</button>
                    <button onclick="setTheme('dark')">Dark Mode</button>
                    <button onclick="setTheme('high-contrast')">High Contrast</button>
                </div>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="{{ url_for('home') }}" tabindex="1">fn</a></li>
                <li><a href="{{ url_for('contact') }}" tabindex="0">Contact</a></li>                
                <li><a href="#" tabindex="3">About</a></li>
                <li><a href="#" tabindex="2">Projects</a></li>                
                <li><a href="{{ url_for('home') }}" tabindex="1">Home</a></li>
            </ul>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <div class="player">
        <ul id="playlist" class="dropdown-content"></ul>
        <div class="line">
            <label class="file-btn" for="upload" tabindex="0">
                <i class="fa-solid fa-upload"></i>
                <input type="file" id="upload" accept="audio/*">
            </label>
            <h3 id="track-title">Loading...</h3>
        </div>
        <div id="progress-container" tabindex="0">
            <div id="progress"></div>
        </div>
        <audio id="audio" preload="metadata"></audio>
        <div class="controls">
            <button id="toggle-list" onclick="toggleList()"><i class="fa-solid fa-list-ul"></i></button>
            <button id="prev"><i class="fa-solid fa-backward-fast"></i></button>
            <button id="play"><i class="fa-solid fa-play"></i></button>
            <button id="next"><i class="fa-solid fa-forward-fast"></i></button>
            <button id="loop"><i class="fa-solid fa-repeat"></i></button>
        </div>
    </div>

    <footer class="footer">
        <p><i class="fa-solid fa-envelope"></i>&emsp;<a href="mailto:2713017@dundee.ac.uk">2713017@dundee.ac.uk</a>&emsp;|&emsp; 
        <i class="fa-solid fa-phone"></i>&emsp;<a href="tel:+447826623341">+44 7826 623341</a>
        <hr>
        &copy; <span id="current-year"></span> My Portfolio</p>
    </footer>

<script src="{{ url_for('static', filename='script.js') }}" defer></script>
</body>
</html>
